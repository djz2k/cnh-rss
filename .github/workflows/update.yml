name: Update Cyanide and Happiness Feed

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 07:00 UTC
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Git pull first to avoid rebase issues
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git pull --rebase origin main

      - name: Run generator script
        run: python generate_cnh_feed.py

      - name: Ensure .nojekyll exists
        run: touch docs/.nojekyll

      - name: Upload debug.html if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug.html
          if-no-files-found: ignore

      - name: Commit and push results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          echo "📂 Docs folder contents before add:"
          ls -lh docs/

          # Add and commit updated files
          git add -f docs/index.html docs/status.html docs/cnh-clean.xml docs/*.html docs/.nojekyll used_comics.json || true
          git status

          git commit -m "🤖 Daily CNH update: $(date +'%Y-%m-%d')" || echo "🟡 No changes to commit"
          git push origin HEAD:main
